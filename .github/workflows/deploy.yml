# Build web/ (Astro) từ data/ đã commit và deploy lên GitHub Pages + Cloudflare Pages (song song).
# Không chạy pipeline: PDF/audio có bản quyền không có trên GitHub.
# Mỗi nơi build riêng vì SITE_URL/BASE_PATH khác nhau (GitHub Pages có base /<repo>, Cloudflare ở gốc "/").
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      # check:gates + astro check + astro build
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Tùy chọn: Settings → Variables → GSC_VERIFICATION = mã meta của Google Search Console
          PUBLIC_GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}
          # Luyện dịch: URL Cloudflare Worker chấm bài (worker/README.md); trống → nút "Chấm bài" bị tắt
          PUBLIC_GRADER_URL: ${{ vars.GRADER_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Cloudflare Pages (Direct Upload). Chỉ chạy khi đã đặt Variable CF_PAGES_PROJECT.
  # Cần: Secrets CLOUDFLARE_API_TOKEN (quyền "Cloudflare Pages: Edit") + CLOUDFLARE_ACCOUNT_ID;
  # Variables CF_PAGES_PROJECT (tên project Pages) và CF_PAGES_SITE_URL (vd https://jp-study.pages.dev hoặc domain riêng).
  deploy-cloudflare:
    if: vars.CF_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: cloudflare-pages
      cancel-in-progress: false
    environment:
      name: cloudflare-pages
      url: ${{ vars.CF_PAGES_SITE_URL }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          SITE_URL: ${{ vars.CF_PAGES_SITE_URL }}
          BASE_PATH: /
          PUBLIC_GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}
          PUBLIC_GRADER_URL: ${{ vars.GRADER_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true
