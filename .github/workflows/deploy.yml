# Build web/ (Astro) từ data/ đã commit và deploy lên GitHub Pages.
# Không chạy pipeline: PDF/audio có bản quyền không có trên GitHub.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      # check:gates + astro check + astro build
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Tùy chọn: Settings → Variables → GSC_VERIFICATION = mã meta của Google Search Console
          PUBLIC_GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}
          # Luyện dịch: URL Cloudflare Worker chấm bài (worker/README.md); trống → nút "Chấm bài" bị tắt
          PUBLIC_GRADER_URL: ${{ vars.GRADER_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
